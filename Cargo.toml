[workspace]
resolver = "2"
members = ["contracts/leaderboard"]

[workspace.package]
version = "0.1.0"
authors = ["RPS Game"]
homepage = "https://polkadot.com/"
license = "GPL-3.0-or-later"
edition = "2024"

[workspace.dependencies]
# No `alloc` feature: the on-chain build uses stack-buffer encoding (no
# allocator-backed codec). The abi-gen feature pulls in alloc on its own for
# the host-side ABI generation build, so the ABI step is unaffected.
pvm-contract-sdk = { git = "https://github.com/paritytech/cargo-pvm-contract", rev = "90f3582a999ee843f79c56378392cfae3c05f0f3" }
polkavm-derive = "0.31"
picoalloc = { version = "5.2", default-features = false }

# Size-optimized build — shrink the PolkaVM blob toward the <10KB target.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false
